<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Niche Watcher{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --secondary-color: #10b981;
            --dark-bg: #1f2937;
            --card-bg: #374151;
            --text-light: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #4b5563;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            line-height: 1.6;
        }

        header {
            background: rgba(17, 24, 39, 0.72);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.85rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 24px rgba(2, 6, 23, 0.35);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        h1 a {
            color: inherit;
            text-decoration: none;
            transition: opacity 0.3s;
        }

        h1 a:hover {
            opacity: 0.8;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            padding: 0.45rem 1.05rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: #0b1220;
            font-weight: 600;
            letter-spacing: 0.01em;
            transition: color 0.25s, border-color 0.25s, box-shadow 0.25s, transform 0.25s, background-color 0.25s;
        }

        nav a:hover,
        nav a:focus-visible {
            color: var(--primary-color);
            border-color: var(--primary-color);
            box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.65), 0 0 18px rgba(99, 102, 241, 0.45);
            transform: translateY(-1px);
        }

        .nav-status {
            margin-left: 0.25rem;
            padding: 0.4rem 0.95rem;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(15, 23, 42, 0.9);
  
        }

        .nav-status.is-true {
            color: var(--primary-color);
            border-color: rgba(99, 102, 241, 0.6);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.35);
        }

        .nav-status.is-false {
            color: var(--text-muted);
            border-color: rgba(148, 163, 184, 0.4);
        }

        main {
            padding: 2rem 0;
            min-height: calc(100vh - 100px);
        }

        h2 {
            font-size: 1.875rem;
            margin-bottom: 1.5rem;
            color: var(--text-light);
        }

        .button {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
            font-size: 1rem;
        }

        .button:hover {
            background-color: #4f46e5;
        }

        .button.secondary {
            background-color: var(--secondary-color);
        }

        .button.secondary:hover {
            background-color: #059669;
        }

        footer {
            background-color: #111827;
            border-top: 1px solid var(--border-color);
            padding: 2rem 0;
            text-align: center;
            color: var(--text-muted);
            margin-top: 3rem;
        }

        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/">Niche Watcher</a></h1>
            {% if user is defined %}
                <span class="nav-status {{ 'is-true' if user.subscribed else 'is-false' }}">Newsletter hebdomadaire: {{ 'true' if user.subscribed else 'false' }}</span>
            {% endif %}
            <nav>
                <a href="/posts">Posts</a>
                <a href="/newsletters">Newsletters</a>
                <a href="/logout">Logout</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Niche Watcher. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
